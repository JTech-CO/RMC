name: Validate RMC
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check UI typography, layout and preserved canvas styles
        run: npm run test:ui
      - name: Fetch the exact runtime libraries and their licenses
        run: npm run vendor && npm run vendor:check
      - name: Test the real HTTP / worker / storage / download path
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: .test-results/
          if-no-files-found: ignore
